name: Build

on:
  push:
  release:
    types: [ published ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    name: Build
    runs-on: [ windows-latest ]

    steps:
    - name: Get latest CMake and ninja
      uses: lukka/get-cmake@latest

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup VS environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build and install debug
      run: |
        cmake --preset x64-Debug .
        cmake --build _build/x64-Debug --parallel
        cmake --install _build/x64-Debug

    - name: Build and install release
      run: |
        cmake --preset x64-Release .
        cmake --build _build/x64-Release --parallel
        cmake --install _build/x64-Release

    - name: Copy debug artifacts
      run: |
        mkdir _dist-debug
        Copy-Item _install/x64-Debug/bin/* -Destination _dist-debug/ -Recurse
        Copy-Item LICENSE -Destination _dist-debug/LICENSE

    - name: Copy release artifacts
      run: |
        mkdir _dist-release
        Copy-Item _install/x64-Release/bin/* -Destination _dist-release/ -Recurse
        Copy-Item LICENSE -Destination _dist-release/LICENSE

    - name: Archive debug
      uses: actions/upload-artifact@v4
      with:
        name: CrashDebugHelper-Debug
        path: _dist-debug/*

    - name: Archive release
      uses: actions/upload-artifact@v4
      with:
        name: CrashDebugHelper-Release
        path: _dist-release/*

  upload_release:
    name: Upload release artifacts
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: _artifacts

    - name: Archive artifact files
      run: |
        mkdir _dist
        for dir in _artifacts/*/; do
          (cd "$dir" && zip -r "$GITHUB_WORKSPACE/_dist/$(basename "$dir").zip" .)
        done

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ github.event.release.id }}
      run: |
        for asset in _dist/*.zip; do
          name=$(basename "$asset")
          # Re-running a release build has to replace the asset, uploading a duplicate name fails
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$name\") | .id" | while read -r id; do
            gh api --method DELETE --silent "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets/$id"
          done
          gh api --method POST --silent \
            -H "Content-Type: application/zip" \
            --input "$asset" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name"
        done
